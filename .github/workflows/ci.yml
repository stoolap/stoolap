name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, 'storage/**' ]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Every test file links its own binary: debug info would multiply in each
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check all features on MSRV
      run: cargo check --all-features

  wasm:
    name: WASM builds (WASI C API, browser)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1, wasm32-unknown-unknown
        components: clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check the C API for wasm32-wasip1
      run: cargo check --lib --target wasm32-wasip1 --no-default-features --features ffi

    # std time, threads and sleeps compile on wasm32-unknown-unknown and panic when called
    - name: Refuse APIs that panic in the browser
      env:
        CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/wasm-clippy
      run: >
        cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features wasm,ffi
        -- -D clippy::disallowed_methods -D clippy::disallowed_types

    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    - name: Run SQL through the browser build
      run: |
        wasm-pack build --dev --target nodejs --out-dir target/wasm-smoke --no-pack . -- --no-default-features --features wasm
        node .github/wasm-smoke/smoke.cjs target/wasm-smoke

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    # Each test runs in a process of its own, so the tests of one binary
    # share no process-wide state
    - name: Run tests
      run: cargo nextest run -P full

    - name: Doc tests
      run: cargo test --doc

    - name: WAL failpoint tests (Windows)
      if: runner.os == 'Windows'
      run: cargo nextest run -P full --features test-failpoints --test persistence -E 'test(/^(failpoint_io_test|wal_torn_tail_test)::/)'

    - name: Heap profile (macOS, Windows)
      if: runner.os != 'Linux'
      run: cargo test --test heap_profile_test --features heap-profile

  feature-gated-tests:
    name: Feature-Gated Tests
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Heap profile (heap-profile)
      run: cargo test --test heap_profile_test --features heap-profile

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    # Every test, so a new failpoint test runs here without being listed
    - name: Failpoint tests
      run: cargo nextest run -P full --features test-failpoints

    # The tests that count allocations set a global allocator of their own,
    # so they need the default stoolap-jemalloc off. They are the top-level
    # files that set one, found here so a new one runs without being listed.
    - name: Allocation counts (system allocator)
      run: |
        cargo test --no-default-features --features parallel --lib storage::volume::secondary
        alloc=$(grep -l '^#\[global_allocator\]' tests/*.rs)
        plain=$(grep -L 'test-failpoints' $alloc | xargs -n1 basename -s .rs | sed 's/^/--test /')
        failpoint=$(grep -l 'test-failpoints' $alloc | xargs -n1 basename -s .rs | sed 's/^/--test /')
        cargo test --no-default-features --features parallel $plain
        cargo test --no-default-features --features parallel,test-failpoints $failpoint -- --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-llvm-cov and nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov,cargo-nextest

    - name: Generate coverage
      run: cargo llvm-cov nextest -P full --all-features --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check License Headers
      run: |
        # Check that all .rs files have the Apache license header
        missing_license=""
        for file in $(find . -name "*.rs" -not -path "./target/*" -not -path "./.git/*"); do
          if ! grep -q "Copyright.*Stoolap Contributors" "$file"; then
            missing_license="$missing_license\n$file"
          fi
        done
        if [ ! -z "$missing_license" ]; then
          echo "Files missing license header:$missing_license"
          exit 1
        fi

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: stoolap
            asset_name: stoolap-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: stoolap
            asset_name: stoolap-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: stoolap
            asset_name: stoolap-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: stoolap
            asset_name: stoolap-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: stoolap.exe
            asset_name: stoolap-windows-amd64.exe
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build binary
      run: cargo build --release --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    - name: Rename artifact
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}
