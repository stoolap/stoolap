name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, 'storage/**' ]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Every test file links its own binary: debug info would multiply in each
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check all features on MSRV
      run: cargo check --all-features

  wasm:
    name: WASM builds (WASI C API, browser)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1, wasm32-unknown-unknown
        components: clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check the C API for wasm32-wasip1
      run: cargo check --lib --target wasm32-wasip1 --no-default-features --features ffi

    # std time, threads and sleeps compile on wasm32-unknown-unknown and panic when called
    - name: Refuse APIs that panic in the browser
      env:
        CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/wasm-clippy
      run: >
        cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features wasm,ffi
        -- -D clippy::disallowed_methods -D clippy::disallowed_types

    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    - name: Run SQL through the browser build
      run: |
        wasm-pack build --dev --target nodejs --out-dir target/wasm-smoke --no-pack . -- --no-default-features --features wasm
        node .github/wasm-smoke/smoke.cjs target/wasm-smoke

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    # Each test runs in a process of its own, so the tests of one binary
    # share no process-wide state
    - name: Run tests
      run: cargo nextest run -P full

    - name: Doc tests
      run: cargo test --doc

    - name: WAL failpoint tests (Windows)
      if: runner.os == 'Windows'
      run: cargo nextest run -P full --features test-failpoints --test persistence -E 'test(/^(failpoint_io_test|wal_torn_tail_test)::/)'

    - name: Heap profile (macOS, Windows)
      if: runner.os != 'Linux'
      run: cargo test --test heap_profile_test --features heap-profile

  feature-gated-tests:
    name: Feature-Gated Tests
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Heap profile (heap-profile)
      run: cargo test --test heap_profile_test --features heap-profile

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Failpoint tests
      run: cargo nextest run -P full --features test-failpoints --test aggregate --test cold_read --test distinct_set --test index --test join --test operators --test order_limit --test persistence --test plan_cache --test prepared --test seal_compaction --test subquery --test transaction --test vector --test window -E 'test(/^(failpoint_io_test|captured_version_payload_test|cold_read_consistency_test|limit_cold_read_consistency_test|limit_seal_consistency_test|secondary_side_file_test|secondary_index_query_test|secondary_index_backfill_test|join_equality_candidates_test|join_consumer_rule_test|join_materialized_side_test|truncate_walk_and_seal_fetch_test|visible_row_race_test|tx_pk_fast_path_test|tx_pk_fast_path_layout_test|unique_get_test|failed_commit_sealed_rows_test|hot_schema_evolution_test|keyless_sealed_hnsw_test|wal_torn_tail_test|snapshot_history_test|committed_cache_test|seal_publication_window_test|seal_deferral_test|seal_dead_copy_test|claim_release_test|unique_plan_check_test|ordered_limited_scan_test|commit_seal_stamp_test|update_fence_metadata_test|targeted_cold_load_test|cluster_by_test|cold_unique_equality_test|column_change_close_test|compaction_publication_order_test|compaction_tombstone_holders_test|compiled_positions_test|count_windows_test|deduped_count_test|drop_column_readers_test|drop_column_transition_test|exists_side_file_probe_test|in_equality_candidates_test|rename_column_index_test|segmented_count_equal_test|semantic_cache_clear_test|semantic_cache_stamp_order_test|small_outer_join_test|statement_gate_order_test|truncate_reader_window_test|txn_status_table_test|unique_check_lock_order_test|unique_index_eviction_test|wal_acknowledged_commit_test|retype_protocol_test|retype_failure_test|commit_recheck_window_test|comparison_contract_test|in_subquery_cache_test|txn_gate_test|commit_recheck_outside_test|insert_cold_rounds_test|delete_cold_rounds_test|statement_view_reads_test|commit_window_reads_test|maintenance_limit_test|in_list_duplicate_members_test|statement_view_test|statement_view_shortcuts_test|view_overtaken_test|view_index_candidates_test|view_removal_history_test|range_top_k_test|order_by_index_gate_test|exists_few_outer_rows_test|min_max_index_test|aggregate_path_equivalence_test|join_path_equivalence_test|join_plan_test|join_nested_side_filter_test|join_group_limit_chunks_test|planned_window_test|prepared_join_test|join_where_blocks_test|join_on_blocks_test|join_side_blocks_test|join_output_blocks_test|merged_join_output_blocks_test|grouped_output_blocks_test|not_in_null_once_test|prepared_exists_test|prepared_in_test|prepared_select_test|prepared_strategy_test|prepared_set_scan_test|hot_streaming_scan_test|prepared_kept_members_test|prepared_dml_test|prepared_conflict_snapshot_test|prepared_dml_snapshot_test|insert_plan_rename_test|read_table_handle_test|limit_subquery_prepare_test|side_index_dictionary_test|subquery_cache_stamp_test|constant_false_where_test|zone_map_visibility_test|order_by_alias_binding_test|old_path_ledger_test|index_count_test|block_cache_identity_test|block_order_limit_test|distinct_set_operation_blocks_test|derived_table_blocks_test|prepared_literal_twin_test|pk_conjunct_test|prepared_where_pushdown_test|shared_literals_test|scan_access_test|prepared_dml_access_test|opened_table_access_test)::/)'

    # The tests that count allocations set a global allocator of their own,
    # so they need the default stoolap-jemalloc off
    - name: Allocation counts (system allocator)
      run: |
        cargo test --no-default-features --features parallel --lib storage::volume::secondary
        cargo test --no-default-features --features parallel --test bind_in_list_alloc_test --test block_prepare_alloc_test --test built_string_alloc_test --test check_scratch_alloc_test --test column_name_length_alloc_test --test commit_undo_allocs_test --test correlated_count_alloc_test --test count_star_alloc_test --test declined_grouped_source_alloc_test --test exists_limit_alloc_test --test exists_probe_fallback_alloc_test --test derived_table_alloc_test --test distinct_on_join_alloc_test --test distinct_stream_alloc_test --test general_order_limit_alloc_test --test grouped_join_names_alloc_test --test grouped_late_key_alloc_test --test grouped_source_window_alloc_test --test hash_join_limit_alloc_test --test hash_probe_alloc_test --test id_list_alloc_test --test index_batch_removal_alloc_test --test index_join_limit_alloc_test --test insert_plan_alloc_test --test integer_reading_alloc_test --test join_key_filter_alloc_test --test join_operator_alloc_test --test join_residual_cache_test --test join_source_side_alloc_test --test keyed_members_alloc_test --test limit_subquery_alloc_test --test parser_alloc_test --test prepared_order_limit_alloc_test --test projection_alloc_test --test projection_evaluator_alloc_test --test read_only_commit_release_test --test retyped_cluster_sort_alloc_test --test row_order_inherit_alloc_test --test runner_aggregate_alloc_test --test row_subquery_alloc_test --test sealed_scan_row_alloc_test --test seal_prepare_alloc_test --test seal_registration_memory_test --test segmented_delete_alloc_test --test segmented_pk_dml_test --test semantic_cache_key_alloc_test --test serde_vector_alloc_test --test set_operation_alloc_test --test smart_string_alloc_test --test streaming_group_by_alloc_test --test text_form_alloc_test --test unique_conflict_alloc_test --test unique_index_build_alloc_test --test values_source_memory_test --test vector_argument_once_test --test vm_stack_alloc_test --test window_argument_alloc_test
        cargo test --no-default-features --features parallel,test-failpoints --test manifest_tombstones_test --test commit_recheck_alloc_test --test insert_cold_alloc_test --test delete_cold_alloc_test -- --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force
        df -h /

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-llvm-cov and nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov,cargo-nextest

    - name: Generate coverage
      run: cargo llvm-cov nextest -P full --all-features --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check License Headers
      run: |
        # Check that all .rs files have the Apache license header
        missing_license=""
        for file in $(find . -name "*.rs" -not -path "./target/*" -not -path "./.git/*"); do
          if ! grep -q "Copyright.*Stoolap Contributors" "$file"; then
            missing_license="$missing_license\n$file"
          fi
        done
        if [ ! -z "$missing_license" ]; then
          echo "Files missing license header:$missing_license"
          exit 1
        fi

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: stoolap
            asset_name: stoolap-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: stoolap
            asset_name: stoolap-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: stoolap
            asset_name: stoolap-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: stoolap
            asset_name: stoolap-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: stoolap.exe
            asset_name: stoolap-windows-amd64.exe
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build binary
      run: cargo build --release --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    - name: Rename artifact
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}
