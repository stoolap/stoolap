name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, 'storage/**' ]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check all features on MSRV
      run: cargo check --all-features

  wasm:
    name: WASM builds (WASI C API, browser)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1, wasm32-unknown-unknown
        components: clippy

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check the C API for wasm32-wasip1
      run: cargo check --lib --target wasm32-wasip1 --no-default-features --features ffi

    # std time, threads and sleeps compile on wasm32-unknown-unknown and panic when called
    - name: Refuse APIs that panic in the browser
      env:
        CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/wasm-clippy
      run: >
        cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features wasm,ffi
        -- -D clippy::disallowed_methods -D clippy::disallowed_types

    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    - name: Run SQL through the browser build
      run: |
        wasm-pack build --dev --target nodejs --out-dir target/wasm-smoke --no-pack . -- --no-default-features --features wasm
        node .github/wasm-smoke/smoke.cjs target/wasm-smoke

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test

    - name: WAL failpoint tests (Windows)
      if: runner.os == 'Windows'
      run: cargo test --test failpoint_io_test --test wal_torn_tail_test --features test-failpoints -- --test-threads=1

    - name: Heap profile (macOS, Windows)
      if: runner.os != 'Linux'
      run: cargo test --test heap_profile_test --features heap-profile

  feature-gated-tests:
    name: Feature-Gated Tests
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Heap profile (heap-profile)
      run: cargo test --test heap_profile_test --features heap-profile

    - name: Failpoint tests
      run: cargo test --test failpoint_io_test --test captured_version_payload_test --test cold_read_consistency_test --test limit_cold_read_consistency_test --test limit_seal_consistency_test --test secondary_side_file_test --test secondary_index_query_test --test secondary_index_backfill_test --test join_equality_candidates_test --test join_consumer_rule_test --test join_materialized_side_test --test truncate_walk_and_seal_fetch_test --test visible_row_race_test --test tx_pk_fast_path_test --test tx_pk_fast_path_layout_test --test failed_commit_sealed_rows_test --test hot_schema_evolution_test --test keyless_sealed_hnsw_test --test wal_torn_tail_test --test snapshot_history_test --test committed_cache_test --test seal_publication_window_test --test seal_deferral_test --test seal_dead_copy_test --test claim_release_test --test unique_plan_check_test --test ordered_limited_scan_test --test commit_seal_stamp_test --test update_fence_metadata_test --test targeted_cold_load_test --test cluster_by_test --test cold_unique_equality_test --test column_change_close_test --test compaction_publication_order_test --test compaction_tombstone_holders_test --test compiled_positions_test --test count_windows_test --test deduped_count_test --test drop_column_readers_test --test drop_column_transition_test --test exists_side_file_probe_test --test in_equality_candidates_test --test rename_column_index_test --test segmented_count_equal_test --test semantic_cache_clear_test --test semantic_cache_stamp_order_test --test small_outer_join_test --test statement_gate_order_test --test truncate_reader_window_test --test txn_status_table_test --test unique_check_lock_order_test --test unique_index_eviction_test --test wal_acknowledged_commit_test --test retype_protocol_test --test retype_failure_test --test commit_recheck_window_test --test comparison_contract_test --test in_subquery_cache_test --test txn_gate_test --test commit_recheck_outside_test --test insert_cold_rounds_test --test delete_cold_rounds_test --test statement_view_reads_test --test commit_window_reads_test --test maintenance_limit_test --test in_list_duplicate_members_test --test statement_view_test --test statement_view_shortcuts_test --test view_overtaken_test --test view_index_candidates_test --test view_removal_history_test --test range_top_k_test --test order_by_index_gate_test --test exists_few_outer_rows_test --test min_max_index_test --test aggregate_path_equivalence_test --test join_path_equivalence_test --test prepared_join_test --test join_where_blocks_test --test join_on_blocks_test --test join_side_blocks_test --test join_output_blocks_test --test grouped_output_blocks_test --test not_in_null_once_test --test prepared_exists_test --test prepared_in_test --test prepared_select_test --test prepared_strategy_test --test prepared_set_scan_test --test hot_streaming_scan_test --test prepared_kept_members_test --test prepared_dml_test --test prepared_conflict_snapshot_test --test prepared_dml_snapshot_test --test insert_plan_rename_test --test read_table_handle_test --test limit_subquery_prepare_test --test side_index_dictionary_test --test subquery_cache_stamp_test --test constant_false_where_test --test zone_map_visibility_test --test order_by_alias_binding_test --test old_path_ledger_test --test index_count_test --test block_cache_identity_test --test block_order_limit_test --test distinct_set_operation_blocks_test --test derived_table_blocks_test --test prepared_literal_twin_test --features test-failpoints -- --test-threads=1

    # The tests that count allocations set a global allocator of their own,
    # so they need the default stoolap-jemalloc off
    - name: Allocation counts (system allocator)
      run: |
        cargo test --no-default-features --features parallel --lib storage::volume::secondary
        cargo test --no-default-features --features parallel --test bind_in_list_alloc_test --test built_string_alloc_test --test check_scratch_alloc_test --test commit_undo_allocs_test --test correlated_count_alloc_test --test exists_limit_alloc_test --test exists_probe_fallback_alloc_test --test derived_table_alloc_test --test distinct_stream_alloc_test --test general_order_limit_alloc_test --test hash_join_limit_alloc_test --test hash_probe_alloc_test --test id_list_alloc_test --test index_batch_removal_alloc_test --test index_join_limit_alloc_test --test insert_plan_alloc_test --test integer_reading_alloc_test --test join_residual_cache_test --test keyed_members_alloc_test --test limit_subquery_alloc_test --test parser_alloc_test --test prepared_order_limit_alloc_test --test projection_evaluator_alloc_test --test read_only_commit_release_test --test retyped_cluster_sort_alloc_test --test row_order_inherit_alloc_test --test seal_prepare_alloc_test --test seal_registration_memory_test --test segmented_delete_alloc_test --test segmented_pk_dml_test --test serde_vector_alloc_test --test set_operation_alloc_test --test streaming_group_by_alloc_test --test text_form_alloc_test --test unique_conflict_alloc_test --test unique_index_build_alloc_test --test values_source_memory_test
        cargo test --no-default-features --features parallel,test-failpoints --test manifest_tombstones_test --test commit_recheck_alloc_test --test insert_cold_alloc_test --test delete_cold_alloc_test -- --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage
      run: cargo llvm-cov --all-features --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check License Headers
      run: |
        # Check that all .rs files have the Apache license header
        missing_license=""
        for file in $(find . -name "*.rs" -not -path "./target/*" -not -path "./.git/*"); do
          if ! grep -q "Copyright.*Stoolap Contributors" "$file"; then
            missing_license="$missing_license\n$file"
          fi
        done
        if [ ! -z "$missing_license" ]; then
          echo "Files missing license header:$missing_license"
          exit 1
        fi

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: stoolap
            asset_name: stoolap-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: stoolap
            asset_name: stoolap-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: stoolap
            asset_name: stoolap-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: stoolap
            asset_name: stoolap-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: stoolap.exe
            asset_name: stoolap-windows-amd64.exe
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build binary
      run: cargo build --release --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    - name: Rename artifact
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}
