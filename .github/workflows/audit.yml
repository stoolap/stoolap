name: Security Audit

on:
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily, after the nightly suite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    # Fails on vulnerabilities; informational advisories (unmaintained, unsound)
    # are reported in the log but do not fail the job or open issues.
    # Accepted advisories live in .cargo/audit.toml with a reason.
    - name: Audit Cargo.lock against the RustSec database
      run: cargo audit
