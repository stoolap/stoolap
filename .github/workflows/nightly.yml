name: Nightly

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto        # Scheduled behavior: one heavy suite + light suites
          - all         # Everything (for manual sweeps)
          - mutation    # Mutation testing only
          - miri        # Miri only
          - stress      # Stress tests only
          - sanitizers  # TSAN + ASAN only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  heavy_plan:
    name: Select Heavy Suite
    runs-on: ubuntu-latest
    outputs:
      run_mutation: ${{ steps.select.outputs.run_mutation }}
      run_miri: ${{ steps.select.outputs.run_miri }}
      miri_group: ${{ steps.select.outputs.miri_group }}
    steps:
    - id: select
      env:
        EVENT_NAME: ${{ github.event_name }}
        SUITE_INPUT: ${{ github.event.inputs.suite }}
      run: |
        suite="${SUITE_INPUT:-auto}"
        run_mutation=false
        run_miri=false
        epoch_day=$(( $(date -u +%s) / 86400 ))
        miri_group=$(( epoch_day % 5 ))

        if [ "$EVENT_NAME" = "schedule" ] || [ "$suite" = "auto" ]; then
          # Both run every night: mutation on the last day's changes,
          # Miri on a rotating module group
          run_mutation=true
          run_miri=true
        else
          case "$suite" in
            all)      run_mutation=true; run_miri=true ;;
            mutation) run_mutation=true ;;
            miri)     run_miri=true ;;
          esac
        fi

        echo "run_mutation=$run_mutation" >> "$GITHUB_OUTPUT"
        echo "run_miri=$run_miri" >> "$GITHUB_OUTPUT"
        echo "miri_group=$miri_group" >> "$GITHUB_OUTPUT"

  stress-tests:
    name: Stress Tests
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'auto'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'stress'
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Crash soak tests
      run: cargo test --test crash_soak_test --features stress-tests
      timeout-minutes: 30

    - name: Metamorphic property tests
      run: cargo test --test metamorphic_test --features stress-tests
      timeout-minutes: 15

    - name: Concurrency history tests
      run: cargo test --test concurrency_history_test --features stress-tests
      timeout-minutes: 15

  thread-sanitizer:
    name: Thread Sanitizer
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'auto'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'sanitizers'
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src

    - name: Cache
      uses: Swatinem/rust-cache@v2

    # The system allocator, so the sanitizer sees every allocation
    - name: Run with ThreadSanitizer
      run: |
        echo 'race:std::alloc::System' > /tmp/tsan_suppressions.txt
        RUSTFLAGS="-Zsanitizer=thread" \
        cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
          --no-default-features --features parallel \
          --test transaction --test plan_cache -- \
          dirty_read_test:: mvcc_isolation_sql_test:: parallel_execution_tests::
      timeout-minutes: 20
      env:
        TSAN_OPTIONS: "second_deadlock_stack=1 suppressions=/tmp/tsan_suppressions.txt"

  address-sanitizer:
    name: Address Sanitizer
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.suite == 'auto'
      || github.event.inputs.suite == 'all'
      || github.event.inputs.suite == 'sanitizers'
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src

    - name: Cache
      uses: Swatinem/rust-cache@v2

    # The system allocator, so the sanitizer sees every allocation
    - name: Run with AddressSanitizer
      run: |
        RUSTFLAGS="-Zsanitizer=address" \
        cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
          --no-default-features --features parallel \
          --test persistence -- \
          durability_test:: snapshot_recovery_test:: persistence_test::
      timeout-minutes: 20
      env:
        ASAN_OPTIONS: "detect_leaks=0"

  mutation:
    name: Mutation Testing (last day's changes)
    needs: heavy_plan
    if: needs.heavy_plan.outputs.run_mutation == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-mutants and nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-mutants,cargo-nextest

    # The lines changed in the last day, within a budget: what the budget
    # leaves untried is reported, not failed
    - name: Run mutation testing (last day's changes)
      run: |
        base=$(git rev-list -n1 --before="24 hours ago" HEAD)
        if [ -z "$base" ]; then
          echo "No commit older than a day"
          exit 0
        fi
        git diff "$base" HEAD -- 'src/**/*.rs' > "$RUNNER_TEMP/day.diff"
        files=(
          -f src/executor/expression/
          -f src/executor/aggregation.rs
          -f src/executor/subquery.rs
          -f src/functions/scalar/
          -f src/storage/mvcc/transaction.rs
          -f src/storage/mvcc/registry.rs
        )
        count=$(cargo mutants --list --in-diff "$RUNNER_TEMP/day.diff" "${files[@]}" | wc -l)
        echo "Mutants in the last day's changes: $count" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$count" -eq 0 ]; then
          exit 0
        fi

        status=0
        timeout -s INT 90m cargo mutants --package stoolap \
          --in-place \
          --baseline=skip \
          --timeout 420 \
          --in-diff "$RUNNER_TEMP/day.diff" \
          "${files[@]}" \
          -- --lib --tests || status=$?
        for outcome in caught missed timeout unviable; do
          n=0
          [ -f "mutants.out/$outcome.txt" ] && n=$(wc -l < "mutants.out/$outcome.txt")
          echo "$outcome: $n" | tee -a "$GITHUB_STEP_SUMMARY"
        done
        # 2: some mutants missed, 3: some timed out, 124: the budget ran out
        case "$status" in
          0|2|3) ;;
          124) echo "Budget of 90 minutes reached before every mutant was tried" | tee -a "$GITHUB_STEP_SUMMARY" ;;
          *) exit "$status" ;;
        esac
      env:
        CARGO_INCREMENTAL: 1
      timeout-minutes: 100

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-report
        path: mutants.out/

  miri:
    name: Miri
    needs: heavy_plan
    if: needs.heavy_plan.outputs.run_miri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - uses: actions/checkout@v4

    - name: Install Rust nightly with Miri
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri

    - name: Install nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Run Miri (rotating module group)
      run: |
        GROUP=${{ needs.heavy_plan.outputs.miri_group }}
        echo "Miri group: ${GROUP}/5"

        # Rotate through 5 module groups (full cycle every 5 days):
        #   0: compact_arc + compact_vec                (fast, unsafe data structures)
        #   1: i64_map                                  (unsafe, recent Stacked Borrows fixes)
        #   2: cow_btree (excluding deep-tree tests)    (unsafe, moderate speed)
        #   3: core:: (value, row, schema, error)       (many tests, moderate speed)
        #   4: cow_btree deep-tree tests only           (slowest tests, ~5-10 min each)
        case "$GROUP" in
          0) FILTER='test(/^common::(compact_arc|compact_vec)::/)' ;;
          1) FILTER='test(/^common::i64_map::/)' ;;
          2) FILTER='test(/^common::cow_btree::/) - test(/deep_tree/)' ;;
          3) FILTER='test(/^core::/)' ;;
          4) FILTER='test(/^common::cow_btree::.*deep_tree/)' ;;
        esac

        echo "Filter: $FILTER"
        # The system allocator: jemalloc keeps its arena chunks mapped for the
        # process's life, which Miri reports as a leak before any test runs
        cargo +nightly miri nextest run --lib --no-default-features --features parallel \
          -E "$FILTER" --no-fail-fast
      env:
        MIRIFLAGS: "-Zmiri-disable-isolation"
