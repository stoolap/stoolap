# `cargo nextest run` uses the default profile, which leaves out the tests
# that judge wall-clock time and the concurrency stress binaries: they turn
# red under load and cost minutes. `cargo nextest run -P full` runs every
# test, for CI and before a merge.

[profile.default]
default-filter = """
not (
  test(=storage::mvcc::version_store::tests::test_unique_constraint_performance_bulk_update)
  | test(=storage::index::multi_column::tests::test_prefix_build_and_batch_removal_scale)
  | test(=foreign_key_test::test_fk_cascade_delete_performance_with_auto_index)
  | test(=executor::expression::program::tests::binding_a_list_ten_times_longer_takes_about_ten_times_longer)
  | test(=statement_timeout_test::every_measured_shape_stops_near_its_timeout)
  | binary(=concurrency_history_test)
  | (binary(=seal_compaction) & test(/^volume_concurrency_test::/))
)
"""
slow-timeout = { period = "60s" }

[profile.full]
default-filter = "all()"

# A test that judges wall-clock time runs with no other test beside it
[[profile.full.overrides]]
filter = """
test(=storage::mvcc::version_store::tests::test_unique_constraint_performance_bulk_update)
| test(=storage::index::multi_column::tests::test_prefix_build_and_batch_removal_scale)
| test(=foreign_key_test::test_fk_cascade_delete_performance_with_auto_index)
| test(=executor::expression::program::tests::binding_a_list_ten_times_longer_takes_about_ten_times_longer)
| test(=statement_timeout_test::every_measured_shape_stops_near_its_timeout)
"""
threads-required = "num-test-threads"
